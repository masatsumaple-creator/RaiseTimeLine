# E2E テスト専用の PostgreSQL。開発用 DB(5432)・perf 用 DB(5433)とは、コンテナ・ポート・ボリュームをすべて分けてある。
#   起動:  npm run db:up
#   完全削除(データごと): npm run db:down
services:
  e2e-db:
    image: postgres:16
    container_name: raisetimeline-e2e-db
    environment:
      POSTGRES_DB: raisetimeline_e2e
      POSTGRES_USER: raisetimeline
      POSTGRES_PASSWORD: raisetimeline
    ports:
      - "5434:5432"
    volumes:
      - e2e-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raisetimeline -d raisetimeline_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  e2e-db-data:
