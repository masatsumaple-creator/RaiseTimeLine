spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/raisetimeline}
    username: ${DB_USER:raisetimeline}
    password: ${DB_PASSWORD:raisetimeline}
  flyway:
    enabled: true

app:
  log:
    # 構造化ログの全行に付く共通タグ(Datadog の service / env / version と同じ名前)
    service: ${LOG_SERVICE:raisetimeline-backend}
    env: ${LOG_ENV:local}
    version: ${LOG_VERSION:unknown}
  jwt:
    # 署名鍵は必須(未設定なら起動に失敗する)。ローカル開発は gradle bootRun が既定値を渡す
    secret: ${JWT_SECRET:}
    # アクセストークンの有効期間。サーバー側で失効できないため短くし、延命はリフレッシュトークンで行う
    expiration: ${JWT_EXPIRATION:15m}
  refresh-token:
    expiration: ${REFRESH_TOKEN_EXPIRATION:7d}
    # Cookie の Secure 属性。本番(HTTPS)は true、HTTP の開発環境のみ false
    cookie-secure: ${REFRESH_COOKIE_SECURE:false}
    reuse-grace: ${REFRESH_REUSE_GRACE:10s}

  s3:
    # 画像の保存先バケット。未設定なら画像機能は無効(アップロードの API は 503 を返し、アイコンは表示名の頭文字になる)
    bucket: ${S3_BUCKET:}
    region: ${S3_REGION:ap-northeast-1}
    # アップロード用の署名付き URL の有効期間。短くして、使い回しを防ぐ
    upload-expiration: ${S3_UPLOAD_EXPIRATION:5m}
    # 表示用の署名付き URL の有効期間。同じ URL を半分の期間使い回し、ブラウザのキャッシュを効かせる(S3 へのリクエスト数も減る)
    get-expiration: ${S3_GET_EXPIRATION:1h}

springdoc:
  # 開発では常に有効。本番は SPRINGDOC_ENABLED=false で API 仕様と Swagger UI を無効にする
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
    # 既存のプロキシ(Vite・CloudFront)が /api だけをバックエンドへ流すため、/api の配下に置く
    path: /api/v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /api/swagger-ui.html
    operations-sorter: method
  default-produces-media-type: application/json

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
