plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.8'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.raisetimeline'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom 'software.amazon.awssdk:bom:2.57.0'
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.1'
	implementation 'software.amazon.awssdk:s3'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.0.1'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ローカル開発専用の署名鍵。JWT_SECRET を設定していれば、そちらを優先する(本番では必ず環境変数で渡す)
tasks.named('bootRun') {
	// 画像用の S3 は、バケット名を環境変数 S3_BUCKET で渡す。未設定なら画像機能は無効(アップロードは 503)。
	// 認証情報は AWS の標準の探し方に任せる。ローカル開発では、既定で ~/.aws の raisetimeline-dev プロファイルを使う
	if (!System.getenv('AWS_PROFILE') && !System.getenv('AWS_ACCESS_KEY_ID')) {
		environment 'AWS_PROFILE', 'raisetimeline-dev'
	}
	if (!System.getenv('JWT_SECRET')) {
		environment 'JWT_SECRET', 'local-dev-only-jwt-secret-change-me-0123456789'
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

// API 仕様書(docs/api/openapi.json)を、コードから生成し直す。Controller / DTO を変えたら実行してコミットする
tasks.register('generateOpenApi', Test) {
	group = 'documentation'
	description = 'Controller と DTO から OpenAPI の仕様書(docs/api/openapi.json)を生成する'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	filter {
		includeTestsMatching 'com.raisetimeline.backend.OpenApiSpecIntegrationTest'
	}
	systemProperty 'openapi.output', rootProject.file('../docs/api/openapi.json').absolutePath
	// 常に実行する(入力が変わらなくても、仕様書を書き出し直す)
	outputs.upToDateWhen { false }
}
